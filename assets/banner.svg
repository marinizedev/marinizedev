<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="bn-title bn-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="bn-title">Marinize Santana — Engenharia de Dados em formação</title>
  <desc id="bn-desc">Banner com o método de trabalho em quatro etapas: investigar, validar, estruturar, entregar.</desc>

  <defs>
    <radialGradient id="glowR" cx="920" cy="150" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8a94a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e8a94a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="120" cy="30" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c97b2a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#c97b2a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flow" x1="730" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ca3af" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e8a94a"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c97b2a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e8a94a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#c97b2a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="1200" height="300" rx="18"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .pulse { animation: travel 4.5s ease-in-out infinite; }
    @keyframes travel {
      0%   { transform: translateX(0);     opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateX(390px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; opacity: 0; }
    }
  </style>

  <g clip-path="url(#round)">
    <!-- Fundo -->
    <rect width="1200" height="300" fill="#0b0b0b"/>
    <rect width="1200" height="300" fill="url(#glowL)"/>
    <rect width="1200" height="300" fill="url(#glowR)"/>
    <rect x="0" y="296" width="1200" height="4" fill="url(#rule)"/>

    <!-- Identidade -->
    <text x="64" y="128" class="sans" font-size="56" font-weight="700" letter-spacing="-1" fill="#f5f0e8">Marinize Santana</text>
    <text x="64" y="172" class="sans" font-size="25" font-weight="500" fill="#e8a94a">Engenharia de Dados em formação</text>
    <text x="64" y="212" class="mono" font-size="17" fill="#9ca3af">Pipelines · Modelagem · Qualidade de Dados</text>

    <!-- Fluxo: investigar → validar → estruturar → entregar -->
    <line x1="730" y1="150" x2="1120" y2="150" stroke="url(#flow)" stroke-width="2"/>

    <g class="mono" font-size="13" fill="#9ca3af" text-anchor="middle">
      <text x="730" y="116">01</text>
      <text x="860" y="116">02</text>
      <text x="990" y="116">03</text>
      <text x="1120" y="116">04</text>
    </g>

    <circle cx="730" cy="150" r="10" fill="#0b0b0b" stroke="#e8a94a" stroke-width="2"/>
    <circle cx="860" cy="150" r="10" fill="#0b0b0b" stroke="#e8a94a" stroke-width="2"/>
    <circle cx="990" cy="150" r="10" fill="#0b0b0b" stroke="#e8a94a" stroke-width="2"/>
    <circle cx="1120" cy="150" r="17" fill="none" stroke="#e8a94a" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="1120" cy="150" r="10" fill="#e8a94a"/>

    <g class="mono" font-size="17" fill="#f5f0e8" text-anchor="middle">
      <text x="730" y="196">investigar</text>
      <text x="860" y="196">validar</text>
      <text x="990" y="196">estruturar</text>
      <text x="1120" y="196">entregar</text>
    </g>

    <!-- Pulso de dado percorrendo o fluxo -->
    <g class="pulse" opacity="0">
      <circle cx="730" cy="150" r="11" fill="#e8a94a" fill-opacity="0.28"/>
      <circle cx="730" cy="150" r="4.5" fill="#f5f0e8"/>
    </g>
  </g>

  <!-- Contorno sutil -->
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#f5f0e8" stroke-opacity="0.08"/>
</svg>
